name: Publicar imagem Runpod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VisagismoAI/**"
      - "VisagismoAI/models/hair_segmentation.onnx"
      - "runpod_deploy/**"
      - ".dockerignore"
      - ".github/workflows/publish-runpod-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod_deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/visagismo-ai-runpod:latest
            ghcr.io/${{ github.repository_owner }}/visagismo-ai-runpod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
